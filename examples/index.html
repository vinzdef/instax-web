<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>instax-web demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main {
        width: min(28rem, 100%);
        display: grid;
        gap: 1rem;
      }
      button {
        font: inherit;
        padding: 0.6rem 1rem;
        border-radius: 0.5rem;
        border: 1px solid currentColor;
        background: none;
        color: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      canvas {
        width: 100%;
        border-radius: 0.5rem;
        background: #0002;
      }
      progress {
        width: 100%;
      }
      #info {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.5rem;
        margin: 0;
        text-align: center;
      }
      #info dt {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.6;
      }
      #info dd {
        margin: 0.15rem 0 0;
        font-size: 1.5rem;
        font-variant-numeric: tabular-nums;
      }
      #info-size,
      #info-model,
      #info-serial {
        font-size: 0.9rem;
        word-break: break-all;
      }
      input[type='color'] {
        width: 3rem;
        height: 2.2rem;
        padding: 0;
        border-radius: 0.4rem;
        border: 1px solid currentColor;
        background: none;
      }
      select {
        font: inherit;
        padding: 0.35rem 0.5rem;
        border-radius: 0.4rem;
        border: 1px solid currentColor;
        background: none;
        color: inherit;
      }
      input[type='number'] {
        width: 6rem;
      }
      label {
        font-size: 0.8rem;
        opacity: 0.7;
        min-width: 6rem;
      }
      .hint {
        font-size: 0.7rem;
        opacity: 0.5;
      }
      #log {
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        white-space: pre-wrap;
        max-height: 12rem;
        overflow-y: auto;
        margin: 0;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>instax-web</h1>
      <div class="row">
        <button id="connect">Connect printer</button>
        <span id="status">not connected</span>
      </div>
      <dl id="info" hidden>
        <div><dt>Film</dt><dd id="info-film">—</dd></div>
        <div><dt>Shots left</dt><dd id="info-shots">—</dd></div>
        <div><dt>Battery</dt><dd id="info-battery">—</dd></div>
        <div><dt>Image size</dt><dd id="info-size">—</dd></div>
        <div><dt>Model</dt><dd id="info-model">—</dd></div>
        <div><dt>Serial</dt><dd id="info-serial">—</dd></div>
      </dl>
      <div class="row">
        <label for="led">LED</label>
        <input id="led" type="color" value="#ff0055" disabled />
        <button id="led-apply" disabled>Set</button>
        <button id="led-pulse" disabled title="Cycles three colours to check the animation fields">Pulse</button>
      </div>
      <div class="row">
        <label for="orientation">Orientation</label>
        <select id="orientation">
          <option value="portrait">Portrait</option>
          <option value="landscape">Landscape</option>
        </select>
      </div>
      <input id="file" type="file" accept="image/*" />
      <canvas id="preview"></canvas>
      <progress id="progress" value="0" max="1"></progress>
      <div class="row">
        <button id="print" disabled>Print</button>
        <button id="cancel" disabled>Cancel</button>
        <button id="eject" disabled title="Ejects the black cover sheet of a fresh pack. Burns a shot if the cover is already out.">
          Eject film cover
        </button>
      </div>
      <pre id="log"></pre>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
