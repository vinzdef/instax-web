<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>instax-web demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main {
        width: min(28rem, 100%);
        display: grid;
        gap: 1rem;
      }
      button {
        font: inherit;
        padding: 0.6rem 1rem;
        border-radius: 0.5rem;
        border: 1px solid currentColor;
        background: none;
        color: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      canvas {
        width: 100%;
        border-radius: 0.5rem;
        background: #0002;
      }
      progress {
        width: 100%;
      }
      #log {
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        white-space: pre-wrap;
        max-height: 12rem;
        overflow-y: auto;
        margin: 0;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>instax-web</h1>
      <div class="row">
        <button id="connect">Connect printer</button>
        <span id="status">not connected</span>
      </div>
      <input id="file" type="file" accept="image/*" />
      <canvas id="preview"></canvas>
      <progress id="progress" value="0" max="1"></progress>
      <div class="row">
        <button id="print" disabled>Print</button>
        <button id="cancel" disabled>Cancel</button>
      </div>
      <pre id="log"></pre>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
